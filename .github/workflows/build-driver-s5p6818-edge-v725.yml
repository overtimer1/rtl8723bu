name: Build rtl8723bu Driver for NanoPC-T3+ (v7.2.5)

on:
  workflow_dispatch:

jobs:
  build-all-in-one:
    runs-on: ubuntu-latest

    steps:
      # 1. 释放磁盘空间
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/share/chromium /opt/hostedtoolcache
          sudo apt-get clean

      # 2. 安装依赖、交叉编译器、QEMU
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev make libncurses-dev \
            python3 python3-pip device-tree-compiler rsync kmod cpio sudo \
            qemu-user-static binfmt-support crossbuild-essential-arm64

      # 3. 启用 QEMU 模拟
      - name: Enable QEMU binfmt
        run: |
          sudo systemctl restart systemd-binfmt || true
          sudo update-binfmts --enable qemu-aarch64 || true
          sudo update-binfmts --enable qemu-arm || true

      # 4. 创建非 root 用户并配置 Docker 权限
      - name: Create non-root user
        run: |
          sudo useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/builder
          sudo chmod 0440 /etc/sudoers.d/builder
          sudo groupadd -f docker
          sudo usermod -aG docker builder
          sudo systemctl restart docker || sudo service docker restart || true
          sleep 5

      # 5. 克隆 Armbian 构建框架并锁定 commit
      - name: Clone Armbian build framework
        run: |
          sudo -u builder -H bash -c '
            cd /home/builder
            git clone https://github.com/armbian/build.git
            cd build
            git checkout 16d039191
          '

      # 6. 编译 7.2.5 头文件（利用缓存，预计 4 分钟）
      - name: Build kernel headers v7.2.5
        run: |
          sudo -u builder -H bash -c '
            cd /home/builder/build
            ./compile.sh kernel \
              BOARD=nanopct3plus \
              BRANCH=edge \
              RELEASE=trixie \
              BUILD_MINIMAL=yes \
              INSTALL_HEADERS=yes \
              USE_OCI_CACHE=yes \
              KERNELBRANCH=tag:v7.2.5
          '

      # 7. 直接安装刚生成的 .deb 头文件（不用去上传下载）
      - name: Install freshly built headers
        run: |
          sudo dpkg -i --force-architecture /home/builder/build/output/debs/linux-headers-*.deb || sudo apt-get install -f -y
          ls -d /usr/src/linux-headers-7.2.5-edge-s5p6818

      # 8. 映射内核路径
      - name: Map kernel headers path
        run: |
          sudo mkdir -p /lib/modules/7.2.5-edge-s5p6818
          sudo ln -sf /usr/src/linux-headers-7.2.5-edge-s5p6818 /lib/modules/7.2.5-edge-s5p6818/build

      # 9. 直接检出你 Fork 的 rtl8723bu 源码
      - name: Checkout rtl8723bu source
        uses: actions/checkout@v4
        with:
          path: rtl8723bu

      # 10. 交叉编译驱动
      - name: Cross-compile driver
        run: |
          cd rtl8723bu
          make clean
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               KSRC=/usr/src/linux-headers-7.2.5-edge-s5p6818 \
               KERNELRELEASE=7.2.5-edge-s5p6818 \
               -j$(nproc)

      # 11. 验证并上传编译好的驱动文件
      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl8723bu-driver-v7.2.5
          path: rtl8723bu/*.ko
          if-no-files-found: error
