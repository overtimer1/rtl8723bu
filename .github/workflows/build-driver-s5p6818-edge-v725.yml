name: Build rtl8723bu Driver for NanoPC-T3+ (v7.2.5)

on:
  workflow_dispatch:

jobs:
  build-all-in-one:
    runs-on: ubuntu-latest

    steps:
      # 1. 释放磁盘空间
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/share/chromium /opt/hostedtoolcache
          sudo apt-get clean

      # 2. 安装依赖、GCC14 交叉编译器、QEMU
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev make libncurses-dev \
            python3 python3-pip device-tree-compiler rsync kmod cpio sudo \
            qemu-user-static binfmt-support gcc-14-aarch64-linux-gnu g++-14-aarch64-linux-gnu dwarves

      # 3. 启用 QEMU 模拟
      - name: Enable QEMU binfmt
        run: |
          sudo systemctl restart systemd-binfmt || true
          sudo update-binfmts --enable qemu-aarch64 || true
          sudo update-binfmts --enable qemu-arm || true

      # 4. 创建非 root 用户并配置 Docker 权限
      - name: Create non-root user
        run: |
          sudo useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/builder
          sudo chmod 0440 /etc/sudoers.d/builder
          sudo groupadd -f docker
          sudo usermod -aG docker builder
          sudo systemctl restart docker || sudo service docker restart || true
          sleep 5

      # 5. 克隆 Armbian 构建框架并锁定 commit
      - name: Clone Armbian build framework
        run: |
          sudo -u builder -H bash -c '
            cd /home/builder
            git clone https://github.com/armbian/build.git
            cd build
            git checkout 16d039191
          '

      # 6. 编译 7.2.5 头文件（利用缓存）
      - name: Build kernel headers v7.2.5
        run: |
          sudo -u builder -H bash -c '
            cd /home/builder/build
            ./compile.sh kernel \
              BOARD=nanopct3plus \
              BRANCH=edge \
              RELEASE=trixie \
              BUILD_MINIMAL=yes \
              INSTALL_HEADERS=yes \
              USE_OCI_CACHE=yes \
              KERNELBRANCH=tag:v7.2.5
          '

      # 7. 解压头文件到临时目录
      - name: Extract freshly built headers
        run: |
          mkdir -p /tmp/headers_extract
          dpkg-deb -x /home/builder/build/output/debs/linux-headers-*.deb /tmp/headers_extract
          ls -d /tmp/headers_extract/usr/src/linux-headers-7.2.5-edge-s5p6818

      # 8. 全局暴力拔除 GCC14 选项
      - name: Global patch to remove GCC14 flag
        run: |
          find /tmp/headers_extract/usr/src/linux-headers-7.2.5-edge-s5p6818/ -name "Makefile" -exec sed -i 's/-fmin-function-alignment=8//g' {} +
          echo "Global patch applied."

      # 9. 检出 rtl8723bu 源码
      - name: Checkout rtl8723bu source
        uses: actions/checkout@v4
        with:
          path: rtl8723bu

      # 10. 🔥 终极绝杀：修改驱动 Makefile，强行修正头文件路径
      - name: Patch driver Makefile
        run: |
          cd rtl8723bu
          # 把错误的 $(src) 替换成绝对路径 $(CURDIR)，确保编译器能找到驱动自己的 include 目录
          sed -i 's|-I$(src)/include|-I$(CURDIR)/include|g' Makefile
          echo "Patched Makefile:"
          grep -n "ccflags-y" Makefile | head -5

      # 11. 交叉编译驱动（同时使用 KCFLAGS 双重保险）
      - name: Cross-compile driver
        run: |
          cd rtl8723bu
          make clean
          make ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CC=aarch64-linux-gnu-gcc-14 \
               KSRC=/tmp/headers_extract/usr/src/linux-headers-7.2.5-edge-s5p6818 \
               KCFLAGS="-I$(pwd)/include" \
               -j$(nproc)

      # 12. 上传编译好的驱动
      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl8723bu-driver-v7.2.5
          path: rtl8723bu/*.ko
          if-no-files-found: error
